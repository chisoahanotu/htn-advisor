name: Deploy sale-ended page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp index.html dist/404.html
          touch dist/.nojekyll
          echo "${{ vars.PAGES_CUSTOM_DOMAIN || 'avalonestatesale.com' }}" > dist/CNAME
          # Keep the legacy hypertension app reachable at /htn/
          cp -r htn dist/htn
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
